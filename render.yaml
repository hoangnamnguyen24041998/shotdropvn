services:
  - type: web
    name: shotdropvn-web
    runtime: node
    rootDir: web
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.22.2
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: https://offobwrujfirkjllvvps.supabase.co
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
