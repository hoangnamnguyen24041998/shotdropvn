name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - mobile-main
    paths:
      - 'mobile/**'
      - 'version.json'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'mobile/package-lock.json'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Read Current Version
        id: version
        run: |
          VERSION=$(node -e "try { console.log(require('./version.json').version); } catch { console.log('1.2.1'); }")
          BUILD=$(node -e "try { console.log(require('./version.json').buildNumber); } catch { console.log('4'); }")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "BUILD=$BUILD" >> $GITHUB_ENV
          echo "Current Version: $VERSION (Build $BUILD)"

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          npm ci --prefer-offline --no-audit

      - name: Prepare Android Keystore & Environment
        run: |
          echo "Using default debug signing config for release APK distribution"

      - name: Build Release APK with Gradle
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"

      - name: Package & Rename APK
        run: |
          APK_SRC="mobile/android/app/build/outputs/apk/release/app-release.apk"
          APK_DEST="ShotDropVN-v${{ env.VERSION }}.apk"
          if [ -f "$APK_SRC" ]; then
            cp "$APK_SRC" "$APK_DEST"
            cp "$APK_SRC" "ShotDropVN-release.apk"
            echo "APK ready: $APK_DEST"
            ls -lh "$APK_DEST"
          else
            echo "Error: Release APK not found at $APK_SRC"
            exit 1
          fi

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShotDropVN-v${{ env.VERSION }}
          path: ShotDropVN-v${{ env.VERSION }}.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/mobile-main'
        with:
          tag_name: v${{ env.VERSION }}
          name: ShotDropVN v${{ env.VERSION }} (Build ${{ env.BUILD }})
          body: |
            ## ShotDropVN v${{ env.VERSION }} (Build ${{ env.BUILD }})
            
            Tự động biên dịch từ commit `${{ github.sha }}` trên nhánh `${{ github.ref_name }}`.
            
            ### Tải về APK:
            - **[ShotDropVN-v${{ env.VERSION }}.apk](https://github.com/${{ github.repository }}/releases/download/v${{ env.VERSION }}/ShotDropVN-v${{ env.VERSION }}.apk)**
          files: |
            ShotDropVN-v${{ env.VERSION }}.apk
            ShotDropVN-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
